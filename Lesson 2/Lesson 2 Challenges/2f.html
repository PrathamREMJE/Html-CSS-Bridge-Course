<html>
<head>
    <title>Challenge 6 Amazon Shop Continuation</title>
</head>
<style>
    .amazon-link-button{
        color: rgb(0,113,133);
    }

    .prod-title{
        font-size: 20px;
        font-style: bold;
    }

    .prod-price{
        color: rgb(0,118,0);
    }

    .delivery-desc{
        font-size: 16px;
    }

    .add-to-cart-button{
        background-color: rgb(255,216,20);
        height: 40px;
        width: 110px;
        border: none;
        border-radius: 50px;
        margin-right: 10px;
        cursor: pointer;
        font-size: 14px;
    }

    .buy-button{
        background-color: rgb(255,164,28);
        height: 40px;
        width: 110px;
        border: none;
        border-radius: 50px;
        cursor: pointer;
        font-size: 14px;

    }
</style>
<body>
  <a href="https://www.amazon.com/" class="amazon-link-button">
    Back to Amazon
  </a>
  <p class="prod-title">
    Nike Black Running Shoes
  </p>
  <p class="prod-price">
    $39.99 in stock
  </p>
  <p class="delivery-desc">
    Free Delivery tommorrow.
  </p>
  <button class="add-to-cart-button">
    Add to Cart
  </button>
  <button class="buy-button">
    Buy now
  </button>

</html>
