<html>
<head>
    <title>Challenge 5 LinkedIn Button Hover Bg Bw</title>
        <style>
            .apply-button{
                background-color: rgb(10,102,194);
                color: white;
                border: none;
                font-weight: bold;
                font-size: 13px;
                height: 40px;
                width: 200px;
                border-radius: 100px;
                cursor: pointer;
                transition: background-color 0.5s;
            }

            .apply-button:hover{
                background-color: rgb(6, 72, 138);
            }

            .save-button{
                color: rgb(10,102,194);
                background-color: white;
                border-color: rgb(10,102,194);
                border-width: 1px;
                font-weight: bold;
                height: 40px;
                width: 70px;
                border-radius: 40px;
                border-style: solid;
                cursor: pointer;
                transition: all 1s;
            }

            .save-button:hover {
                background-color: rgb(226, 240, 254);
                border-width: 2px;
            }

        </style>
</head>
<body>
    <button class="apply-button">
       Apply on Company website 
    </button>
    <button class="save-button">
        Save
    </button>
</body>
</html>
