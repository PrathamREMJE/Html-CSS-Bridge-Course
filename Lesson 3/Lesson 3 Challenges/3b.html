<html>
<head>
    <title>Challenge 2 Amazon Button Hover Bg Effect</title>
    <style>
        .amazon-button {
            background-color: rgb(255, 216, 20);
            border: none;
            height: 40px;
            width: 140px;
            border-radius: 15px;
            cursor: pointer;
            transition: background-color 1s;
        }

        .amazon-button:hover{
            background-color: rgb(225, 191, 21);
        }
    </style>
</head>
<body>
    <button class="amazon-button">
        Add to Cart
    </button>
</body>
</html>
