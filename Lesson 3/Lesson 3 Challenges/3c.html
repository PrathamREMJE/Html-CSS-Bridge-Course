<html>
<head>
    <title>Challenge 3 GitHub Button Hover Shadow Effect</title>
        <style>
            .github-button {
                background-color: rgb(46, 164, 79);
                color: white;
                border: none;
                height: 40px;
                width: 90px;
                font-weight: bold;
                font-size: 15px;
                border-radius: 6px;
                cursor: pointer;
                transition: box-shadow 0.5s;
            }

            .github-button:hover{
                box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.15);
            }
        </style>
</head>
<body>
    <button class="github-button">
       Sign Up
    </button>
</body>
</html>
