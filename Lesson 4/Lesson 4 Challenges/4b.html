<html> 
<head> 
    <title>Challenge 2 Amazon Button Box Sizing Padding</title> 
    <style> 
        .amazon-button { 
            background-color: rgb(255, 216, 20); 
            border: none; 
            padding: 12px 20px; 
            border-radius: 15px; 
            cursor: pointer; 
            transition: background-color 1s; 
        } 
 
        .amazon-button:hover{ 
            background-color: rgb(225, 191, 21); 
        } 
    </style> 
</head> 
<body> 
    <button class="amazon-button"> 
        Add to Cart 
    </button> 
</body> 
</html>
