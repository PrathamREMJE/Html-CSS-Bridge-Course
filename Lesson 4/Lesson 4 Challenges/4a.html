<html> 
<head> 
    <title>Challenge 1 Uber Button Box Sizing Padding</title> 
    <style> 
        .uber-button { 
            background-color: black; 
            color: white; 
            border: none; 
            padding: 17px 20px; 
            font-size: 13px; 
            cursor: pointer; 
            transition: opacity 0.15s; 
        } 
 
        .uber-button:hover { 
            opacity: 0.8; 
        } 
    </style> 
</head> 
<body> 
    <button class="uber-button"> 
        Request Now 
    </button> 
</body> 
</html>
