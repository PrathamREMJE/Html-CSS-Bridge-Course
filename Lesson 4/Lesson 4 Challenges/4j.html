<html>
<head>
    <title>3D Click Button</title>

    <style>
        .click-button {
            background-color: green;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            box-shadow: 5px 5px 10px gray;
        }

        .click-button:hover {
            box-shadow: none;
            margin-top: 4px;
            margin-left: 4px;
        }
    </style>
</head>

<body>

    <button class="click-button">
        Shadow
    </button>

</body>
</html>
