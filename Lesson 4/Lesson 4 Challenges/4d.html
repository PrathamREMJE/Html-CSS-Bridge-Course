<html> 
<head> 
    <title>Challenge 4 Bootstrap Button Box Sizing Padding</title> 
        <style> 
            .get-started-button{ 
                background-color: rgb(121,82,179); 
                color: white; 
                border: none; 
                font-weight: bold; 
                padding: 12px 20px; 
                border-radius: 5px; 
                cursor: pointer; 
                transition: background-color 1s; 
            } 
 
            .get-started-button:hover{ 
                background-color: rgb(89, 55, 142); 
            } 
 
            .download-button{ 
                color: rgb(108,117,125); 
                background-color: white; 
                border-color: blueviolet; 
                border-width: 1px; 
                font-weight: bold; 
                padding: 12px 20px; 
                border-radius: 5px; 
                cursor: pointer; 
                transition: background-color 0.5s,color 0.5s; 
            } 
 
            .download-button:hover{ 
                background-color: rgb(108,117,125); 
                color: white; 
            } 
        </style> 
</head> 
<body> 
    <button class="get-started-button"> 
       Get Started   
    </button> 
    <button class="download-button"> 
        Download 
    </button> 
</body> 
</html>
