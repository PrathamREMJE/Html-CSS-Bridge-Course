<html>
<head>
    <title>One Two Three Buttons Margin Padding Stretch</title>

    <style>
        .number-button {
            background-color: green;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 0 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .number-button:hover {
            padding-left: 30px;
            padding-right: 30px;
            margin-left: -5px;
            margin-right: -5px;
        }
    </style>
</head>

<body>

    <button class="number-button">
        One
    </button>

    <button class="number-button">
        Two
    </button>

    <button class="number-button">
        Three
    </button>

</body>
</html>
