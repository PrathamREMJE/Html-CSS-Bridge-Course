<html>
<head>
    <title>Stretch Button Hover</title>
    
    <style>
        .stretch-button {
            background-color: green;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            transition: padding 0.5s;
        }

        .stretch-button:hover {
            padding: 20px 40px;
        }
    </style>
</head>

<body>

    <button class="stretch-button">
        Stretch
    </button>

</body>
</html>
